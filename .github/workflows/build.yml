name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Needed to create tags and publish releases from the workflow.
# actions: write is needed to dispatch docs.yml after the changelog commit.
permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so release notes can diff against the previous tag.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compute version
        id: ver
        run: |
          BASE=$(grep '^appVersionBase=' gradle.properties | cut -d= -f2)
          echo "version=${BASE}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        # Only available for pushes (secrets are not exposed to fork PRs).
        if: github.event_name == 'push'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK (GitHub flavor)
        # The `github` flavor keeps the in-app APK self-updater. `assemblePlayRelease`
        # produces the Play Store variant (no REQUEST_INSTALL_PACKAGES) — see app/build.gradle.kts.
        run: ./gradlew assembleGithubRelease -PbuildNumber=${{ github.run_number }}
        env:
          KEYSTORE_PATH: ${{ github.event_name == 'push' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/github/release/app-github-release.apk \
            "artifacts/wardove-v${{ steps.ver.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wardove-v${{ steps.ver.outputs.version }}
          path: artifacts/*.apk
          retention-days: 30

      - name: Create release tag
        # changelogithub resolves from/to tags from the local clone, so the tag
        # must exist locally and on GitHub before it runs. Created after the
        # build so a failed build never leaves a stray tag.
        if: github.event_name == 'push'
        run: |
          git tag "v${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"

      - name: Publish release
        # Only publish a release for pushes to the main repo, not for PRs.
        if: github.event_name == 'push'
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Wardove v${{ steps.ver.outputs.version }}
          files: artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes (changelogithub)
        # Rewrites the release body from Conventional Commits since the previous
        # tag (config in changelogithub.config.json). --name is required or the
        # PATCH would rename the release to the bare tag name.
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx changelogithub@14
          --to "v${{ steps.ver.outputs.version }}"
          --name "Wardove v${{ steps.ver.outputs.version }}"

      - name: Fetch release notes
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases/${{ steps.release.outputs.id }}" \
            --jq .body > /tmp/release_body.md

      - name: Update docs/changelog.md
        if: github.event_name == 'push'
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: python3 .github/scripts/update_changelog.py

      - name: Commit changelog
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/changelog.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: update changelog for v${{ steps.ver.outputs.version }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Deploy updated docs
        # The changelog commit above uses [skip ci] and is pushed via GITHUB_TOKEN,
        # so it never triggers docs.yml on its own. workflow_dispatch is exempt
        # from GITHUB_TOKEN's loop-prevention, so trigger the docs deploy explicitly.
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docs.yml --ref ${{ github.ref_name }}
